<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; padding:0; }
  body { background: var(--bg); padding: 24px 28px; font-family: var(--font-sans); }
  .label-row { font-size: 11px; color: var(--fg-subtle); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; font-weight: 500; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 64px; height: 64px; background: var(--neutral-050); border: 1px solid var(--border); }
  .nm { font-family: var(--font-mono); font-size: 10px; color: var(--fg); }
  .px { font-family: var(--font-mono); font-size: 10px; color: var(--fg-subtle); }
</style>
</head>
<body>
  <div class="label-row">Radius scale</div>
  <div class="grid">
    <div class="item"><div class="box" style="border-radius: 0"></div><div class="nm">none</div><div class="px">0</div></div>
    <div class="item"><div class="box" style="border-radius: 4px"></div><div class="nm">sm</div><div class="px">4</div></div>
    <div class="item"><div class="box" style="border-radius: 6px"></div><div class="nm">md ★</div><div class="px">6</div></div>
    <div class="item"><div class="box" style="border-radius: 10px"></div><div class="nm">lg</div><div class="px">10</div></div>
    <div class="item"><div class="box" style="border-radius: 14px"></div><div class="nm">xl</div><div class="px">14</div></div>
    <div class="item"><div class="box" style="border-radius: 20px"></div><div class="nm">2xl</div><div class="px">20</div></div>
    <div class="item"><div class="box" style="border-radius: 999px"></div><div class="nm">pill</div><div class="px">999</div></div>
  </div>
</body></html>
