<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; padding:0; }
  body { background: var(--bg); padding: 28px 32px; font-family: var(--font-sans); }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: baseline; padding: 14px 0; border-bottom: 1px solid var(--border-subtle); }
  .row:last-child { border-bottom: none; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--fg-subtle); white-space: nowrap; }
  .label-row { font-size: 11px; color: var(--fg-subtle); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; font-weight: 500; margin-bottom: 8px; }
</style>
</head>
<body>
  <div class="label-row">Display & Headings · Inter</div>
  <div class="row"><span class="display" style="font-size: 64px;">Estruturação</span><span class="meta">display · 88/0.98 · -0.035</span></div>
  <div class="row"><h1>Diagnóstico em 14 dias</h1><span class="meta">h1 · 48/1.05 · 600</span></div>
  <div class="row"><h2>Operação que escala</h2><span class="meta">h2 · 36/1.2 · 600</span></div>
  <div class="row"><h3>Modelo de aquisição</h3><span class="meta">h3 · 28/1.2 · 600</span></div>
  <div class="row"><h4>Pricing & unit economics</h4><span class="meta">h4 · 22/1.2 · 600</span></div>
</body></html>
