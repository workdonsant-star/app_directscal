<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; padding:0; }
  body { background: var(--bg); padding: 28px; font-family: var(--font-sans); display: flex; flex-direction: column; gap: 20px; }
  .label-row { font-size: 11px; color: var(--fg-subtle); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; font-weight: 500; }
  .block { display: flex; align-items: center; gap: 24px; padding: 20px; border: 1px solid var(--border); border-radius: 10px; }
  .block.dark { background: var(--neutral-900); border-color: var(--neutral-900); }
  .block img { height: 28px; }
  .block.dark img { filter: brightness(0) invert(1); }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--fg-subtle); margin-left: auto; }
  .block.dark .meta { color: var(--neutral-400); }
</style>
</head>
<body>
  <div class="label-row">Wordmark · primary lockup</div>
  <div class="block">
    <img src="../assets/directscal-logo.svg" alt="Directscal">
    <span class="meta">light bg · 28px height</span>
  </div>
  <div class="block dark">
    <img src="../assets/directscal-logo.svg" alt="Directscal">
    <span class="meta">dark bg · invert filter</span>
  </div>
</body></html>
