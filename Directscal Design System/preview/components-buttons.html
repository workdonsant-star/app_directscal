<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; padding:0; }
  body { background: var(--bg); padding: 28px 32px; font-family: var(--font-sans); }
  .label-row { font-size: 11px; color: var(--fg-subtle); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; font-weight: 500; margin-bottom: 14px; }
  .grid { display: grid; grid-template-columns: repeat(4, auto); gap: 14px; align-items: center; justify-content: start; }
  .row-label { font-family: var(--font-mono); font-size: 10px; color: var(--fg-subtle); padding-right: 4px; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 36px; padding: 0 14px;
    border-radius: 6px; border: 1px solid transparent;
    font-family: var(--font-sans); font-size: 13px; font-weight: 500;
    letter-spacing: -0.005em;
    cursor: pointer; transition: all 120ms cubic-bezier(0.22,0.61,0.36,1);
    line-height: 1;
  }
  .btn-primary { background: var(--brand-500); color: white; border-color: var(--brand-600); }
  .btn-primary:hover { background: var(--brand-600); }
  .btn-primary.press { background: var(--brand-700); transform: translateY(1px); }

  .btn-secondary { background: white; color: var(--fg); border-color: var(--border); box-shadow: var(--shadow-xs); }
  .btn-secondary:hover { background: var(--neutral-025); border-color: var(--border-strong); }

  .btn-ghost { background: transparent; color: var(--fg); border-color: transparent; }
  .btn-ghost:hover { background: var(--neutral-100); }

  .btn-link { background: transparent; color: var(--accent); border-color: transparent; padding: 0 4px; height: auto; }
  .btn-link:hover { color: var(--accent-hover); }

  .btn[disabled] { opacity: 0.5; pointer-events: none; }

  .arrow { font-size: 14px; line-height: 0; }
</style>
</head>
<body>
  <div class="label-row">Buttons · Primary, Secondary, Ghost, Link</div>
  <div class="grid">
    <span class="row-label">default</span>
    <button class="btn btn-primary">Solicitar diagnóstico <span class="arrow">→</span></button>
    <button class="btn btn-secondary">Ver método</button>
    <button class="btn btn-ghost">Cancelar</button>

    <span class="row-label">hover</span>
    <button class="btn btn-primary" style="background: var(--brand-600)">Solicitar diagnóstico <span class="arrow">→</span></button>
    <button class="btn btn-secondary" style="background: var(--neutral-025); border-color: var(--border-strong);">Ver método</button>
    <button class="btn btn-ghost" style="background: var(--neutral-100)">Cancelar</button>

    <span class="row-label">press / focus</span>
    <button class="btn btn-primary press">Solicitar diagnóstico <span class="arrow">→</span></button>
    <button class="btn btn-secondary" style="box-shadow: 0 0 0 2px white, 0 0 0 4px var(--brand-500);">Ver método</button>
    <button class="btn btn-link">Ler estudo de caso →</button>
  </div>
</body></html>
