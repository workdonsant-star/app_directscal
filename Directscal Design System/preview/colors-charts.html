<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; padding:0; }
  body { background: var(--bg); padding: 24px; font-family: var(--font-sans); }
  .label-row { font-size: 11px; color: var(--fg-subtle); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; font-weight: 500; margin-bottom: 12px; }
  .layout { display: grid; grid-template-columns: 220px 1fr; gap: 24px; align-items: end; }
  .stops { display: flex; flex-direction: column; gap: 6px; }
  .stop { display: grid; grid-template-columns: 14px 1fr auto; gap: 8px; align-items: center; font-size: 11px; }
  .dot { width: 14px; height: 14px; border-radius: 3px; }
  .stop .nm { font-weight: 500; }
  .stop .hx { font-family: var(--font-mono); color: var(--fg-subtle); font-size: 10px; }
  .chart { height: 180px; display: flex; align-items: end; gap: 6px; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--bg); }
  .bar { flex: 1; border-radius: 2px 2px 0 0; min-width: 8px; }
</style>
</head>
<body>
  <div class="label-row">Charts · McKinsey-style data palette</div>
  <div class="layout">
    <div class="stops">
      <div class="stop"><span class="dot" style="background:#185EFF"></span><span class="nm">chart-1</span><span class="hx">#185EFF</span></div>
      <div class="stop"><span class="dot" style="background:#0B2E78"></span><span class="nm">chart-2</span><span class="hx">#0B2E78</span></div>
      <div class="stop"><span class="dot" style="background:#4A82FF"></span><span class="nm">chart-3</span><span class="hx">#4A82FF</span></div>
      <div class="stop"><span class="dot" style="background:#8AB0FF"></span><span class="nm">chart-4</span><span class="hx">#8AB0FF</span></div>
      <div class="stop"><span class="dot" style="background:#1C1C20"></span><span class="nm">chart-5</span><span class="hx">#1C1C20</span></div>
      <div class="stop"><span class="dot" style="background:#C9C9CE"></span><span class="nm">chart-6</span><span class="hx">#C9C9CE</span></div>
      <div class="stop"><span class="dot" style="background:#117A4D"></span><span class="nm">positive</span><span class="hx">#117A4D</span></div>
      <div class="stop"><span class="dot" style="background:#B42318"></span><span class="nm">negative</span><span class="hx">#B42318</span></div>
    </div>
    <div class="chart">
      <div class="bar" style="background:#185EFF; height: 80%"></div>
      <div class="bar" style="background:#0B2E78; height: 65%"></div>
      <div class="bar" style="background:#4A82FF; height: 90%"></div>
      <div class="bar" style="background:#8AB0FF; height: 50%"></div>
      <div class="bar" style="background:#1C1C20; height: 70%"></div>
      <div class="bar" style="background:#C9C9CE; height: 35%"></div>
      <div class="bar" style="background:#117A4D; height: 55%"></div>
      <div class="bar" style="background:#B42318; height: 25%"></div>
    </div>
  </div>
</body></html>
