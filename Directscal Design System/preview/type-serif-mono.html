<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; padding:0; }
  body { background: var(--bg); padding: 28px 32px; font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .label-row { font-size: 11px; color: var(--fg-subtle); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; font-weight: 500; margin-bottom: 12px; }
  .quote { font-family: var(--font-serif); font-style: italic; font-size: 38px; line-height: 1.05; letter-spacing: -0.015em; color: var(--fg); }
  .quote .em { color: var(--accent); }
  .kpi { display: flex; flex-direction: column; gap: 4px; padding: 16px; border: 1px solid var(--border); border-radius: var(--radius-md); }
  .kpi-num { font-family: var(--font-mono); font-size: 36px; font-weight: 600; letter-spacing: -0.02em; color: var(--fg); font-variant-numeric: tabular-nums; }
  .kpi-num .delta { font-size: 16px; color: #117A4D; margin-left: 4px; vertical-align: middle; }
  .kpi-lab { font-size: 12px; color: var(--fg-subtle); text-transform: uppercase; letter-spacing: var(--tracking-eyebrow); }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--fg-subtle); margin-top: 12px; }
  code.inline { background: var(--neutral-050); border: 1px solid var(--border-subtle); padding: 1px 6px; border-radius: 4px; font-size: 12px; color: var(--fg); }
</style>
</head>
<body>
  <div class="grid">
    <div>
      <div class="label-row">Serif · pull quote</div>
      <div class="quote">Método primeiro.<br><span class="em">Tudo o resto</span> é execução.</div>
      <div class="meta">Instrument Serif italic · 38/1.05</div>
    </div>
    <div>
      <div class="label-row">Mono · KPI & code</div>
      <div class="kpi"><span class="kpi-lab">Margem op.</span><span class="kpi-num">+38%<span class="delta">▲ 12pp</span></span></div>
      <div class="meta" style="margin-top:14px;">Use <code class="inline">--font-mono</code> + <code class="inline">tabular-nums</code></div>
    </div>
  </div>
</body></html>
