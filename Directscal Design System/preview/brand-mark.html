<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; padding:0; }
  body { background: var(--bg); padding: 24px 28px; font-family: var(--font-sans); }
  .label-row { font-size: 11px; color: var(--fg-subtle); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; font-weight: 500; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
  .flag { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 999px; font-size: 10px; font-weight: 500; background: #FFF1D6; color: #8A5A0E; border: 1px solid #F2D9A0; letter-spacing: 0; text-transform: none; }
  .grid { display: grid; grid-template-columns: 80px 80px 80px 1fr; gap: 18px; align-items: center; }
  .mark {
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--bg);
    aspect-ratio: 1 / 1;
    overflow: hidden;
    position: relative;
  }
  .mark.dark { background: var(--neutral-900); border-color: var(--neutral-900); }
  .mark.brand { background: var(--brand-500); border-color: var(--brand-500); }
  .mark img { width: 60%; height: 60%; object-fit: contain; display: block; }
  .mark.dark img { filter: brightness(0) invert(1); }
  .mark.brand img { filter: brightness(0) invert(1); }
  /* Fallback: when the favicon file is empty, show extracted chevrons */
  .mark .fallback {
    width: 60%; height: 60%;
    display: flex; align-items: center; justify-content: center;
  }
  .mark .fallback svg { width: 100%; height: auto; }
  .desc { font-size: 12px; color: var(--fg-muted); line-height: 1.55; }
  .desc strong { color: var(--fg); font-weight: 600; }
  .desc code { font-family: var(--font-mono); font-size: 11px; background: var(--neutral-050); padding: 1px 5px; border-radius: 3px; border: 1px solid var(--border-subtle); }
  .size-row { display: flex; gap: 8px; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-subtle); }
  .size-row .label { font-size: 10px; color: var(--fg-subtle); letter-spacing: 0.06em; text-transform: uppercase; margin-right: 4px; }
  .pixel-mark { width: 16px; height: 16px; background: var(--brand-500); border-radius: 2px; display: inline-flex; align-items: center; justify-content: center; }
  .pixel-mark svg { width: 70%; height: 70%; }
  .pixel-mark.lg { width: 24px; height: 24px; border-radius: 3px; }
  .pixel-mark.xl { width: 32px; height: 32px; border-radius: 4px; }
</style>
</head>
<body>
  <div class="label-row">
    <span>Brand symbol · favicon</span>
    <span class="flag">⚠ favicon SVG enviado está vazio — usando chevrons como placeholder</span>
  </div>
  <div class="grid">
    <!-- light -->
    <div class="mark">
      <div class="fallback">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <path d="M 12 12 L 44 50 L 12 88 L 12 70 L 28 50 L 12 30 Z" fill="#185EFF"/>
          <path d="M 88 12 L 56 50 L 88 88 L 88 70 L 72 50 L 88 30 Z" fill="#185EFF"/>
        </svg>
      </div>
    </div>
    <!-- dark -->
    <div class="mark dark">
      <div class="fallback">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <path d="M 12 12 L 44 50 L 12 88 L 12 70 L 28 50 L 12 30 Z" fill="#FFFFFF"/>
          <path d="M 88 12 L 56 50 L 88 88 L 88 70 L 72 50 L 88 30 Z" fill="#FFFFFF"/>
        </svg>
      </div>
    </div>
    <!-- brand -->
    <div class="mark brand">
      <div class="fallback">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <path d="M 12 12 L 44 50 L 12 88 L 12 70 L 28 50 L 12 30 Z" fill="#FFFFFF"/>
          <path d="M 88 12 L 56 50 L 88 88 L 88 70 L 72 50 L 88 30 Z" fill="#FFFFFF"/>
        </svg>
      </div>
    </div>
    <div class="desc">
      O <strong>favicon</strong> é o símbolo oficial da marca — usado em <code>&lt;link rel="icon"&gt;</code>, ícones de app, avatares e como bullet de seção em escala pequena.
      <div class="size-row">
        <span class="label">tamanhos</span>
        <span class="pixel-mark"><svg viewBox="0 0 100 100"><path d="M 12 12 L 44 50 L 12 88 L 12 70 L 28 50 L 12 30 Z" fill="#fff"/><path d="M 88 12 L 56 50 L 88 88 L 88 70 L 72 50 L 88 30 Z" fill="#fff"/></svg></span>
        <span class="pixel-mark lg"><svg viewBox="0 0 100 100"><path d="M 12 12 L 44 50 L 12 88 L 12 70 L 28 50 L 12 30 Z" fill="#fff"/><path d="M 88 12 L 56 50 L 88 88 L 88 70 L 72 50 L 88 30 Z" fill="#fff"/></svg></span>
        <span class="pixel-mark xl"><svg viewBox="0 0 100 100"><path d="M 12 12 L 44 50 L 12 88 L 12 70 L 28 50 L 12 30 Z" fill="#fff"/><path d="M 88 12 L 56 50 L 88 88 L 88 70 L 72 50 L 88 30 Z" fill="#fff"/></svg></span>
        <span style="font-family: var(--font-mono); font-size: 10px; color: var(--fg-subtle); margin-left: 6px;">16 · 24 · 32 px</span>
      </div>
    </div>
  </div>
</body></html>
