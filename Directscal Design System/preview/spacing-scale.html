<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; padding:0; }
  body { background: var(--bg); padding: 24px 28px; font-family: var(--font-sans); }
  .label-row { font-size: 11px; color: var(--fg-subtle); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; font-weight: 500; margin-bottom: 14px; }
  .row { display: grid; grid-template-columns: 60px 1fr 80px; align-items: center; gap: 12px; padding: 6px 0; }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--fg); }
  .px { font-family: var(--font-mono); font-size: 11px; color: var(--fg-subtle); text-align: right; }
  .bar { height: 14px; background: var(--brand-500); border-radius: 2px; }
  .bar.muted { background: var(--neutral-300); }
</style>
</head>
<body>
  <div class="label-row">Spacing scale · 4px base</div>
  <div class="row"><span class="name">space-1</span><div class="bar muted" style="width: 4px"></div><span class="px">4 px</span></div>
  <div class="row"><span class="name">space-2</span><div class="bar muted" style="width: 8px"></div><span class="px">8 px</span></div>
  <div class="row"><span class="name">space-3</span><div class="bar muted" style="width: 12px"></div><span class="px">12 px</span></div>
  <div class="row"><span class="name">space-4</span><div class="bar" style="width: 16px"></div><span class="px">16 px</span></div>
  <div class="row"><span class="name">space-6</span><div class="bar" style="width: 24px"></div><span class="px">24 px</span></div>
  <div class="row"><span class="name">space-8</span><div class="bar" style="width: 32px"></div><span class="px">32 px</span></div>
  <div class="row"><span class="name">space-12</span><div class="bar" style="width: 48px"></div><span class="px">48 px</span></div>
  <div class="row"><span class="name">space-16</span><div class="bar" style="width: 64px"></div><span class="px">64 px</span></div>
  <div class="row"><span class="name">space-24</span><div class="bar" style="width: 96px"></div><span class="px">96 px</span></div>
</body></html>
