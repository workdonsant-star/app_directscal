<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; padding:0; }
  body { background: var(--bg); padding: 24px 28px; font-family: var(--font-sans); }
  .label-row { font-size: 11px; color: var(--fg-subtle); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; font-weight: 500; margin-bottom: 14px; }
  .chart-card { border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; }
  .chart-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .chart-title { font-size: 14px; font-weight: 600; color: var(--fg); }
  .legend { display: flex; gap: 14px; font-size: 11px; color: var(--fg-muted); }
  .legend .l { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; }
  svg { display: block; width: 100%; height: 180px; }
  .axis { stroke: var(--neutral-300); stroke-width: 1; }
  .grid-line { stroke: var(--neutral-100); stroke-width: 1; }
  .tick { font-family: var(--font-mono); font-size: 10px; fill: var(--fg-subtle); }
</style>
</head>
<body>
  <div class="label-row">Chart sample · structured palette in use</div>
  <div class="chart-card">
    <div class="chart-head">
      <span class="chart-title">Margem operacional · cohorts 2024–2026</span>
      <div class="legend">
        <span class="l"><span class="swatch" style="background:#185EFF"></span>Pós-Directscal</span>
        <span class="l"><span class="swatch" style="background:#0B2E78"></span>Baseline</span>
        <span class="l"><span class="swatch" style="background:#C9C9CE"></span>Setor</span>
      </div>
    </div>
    <svg viewBox="0 0 600 180" preserveAspectRatio="none">
      <!-- grid -->
      <line class="grid-line" x1="40" y1="20" x2="600" y2="20"/>
      <line class="grid-line" x1="40" y1="60" x2="600" y2="60"/>
      <line class="grid-line" x1="40" y1="100" x2="600" y2="100"/>
      <line class="grid-line" x1="40" y1="140" x2="600" y2="140"/>
      <!-- axis -->
      <line class="axis" x1="40" y1="160" x2="600" y2="160"/>
      <!-- ticks -->
      <text class="tick" x="0" y="24">40%</text>
      <text class="tick" x="0" y="64">30%</text>
      <text class="tick" x="0" y="104">20%</text>
      <text class="tick" x="0" y="144">10%</text>
      <!-- setor (gray) -->
      <polyline points="40,120 130,118 220,116 310,115 400,114 490,113 580,113" stroke="#C9C9CE" stroke-width="1.5" fill="none"/>
      <!-- baseline (navy) -->
      <polyline points="40,110 130,108 220,107 310,108 400,107 490,108 580,107" stroke="#0B2E78" stroke-width="1.5" fill="none" stroke-dasharray="3 3"/>
      <!-- post (brand) -->
      <polyline points="40,108 130,98 220,82 310,68 400,56 490,42 580,30" stroke="#185EFF" stroke-width="2.5" fill="none"/>
      <!-- end dot -->
      <circle cx="580" cy="30" r="4" fill="#185EFF"/>
      <!-- x labels -->
      <text class="tick" x="40" y="175">Q1·24</text>
      <text class="tick" x="220" y="175">Q3·24</text>
      <text class="tick" x="400" y="175">Q1·25</text>
      <text class="tick" x="555" y="175">Q4·25</text>
    </svg>
  </div>
</body></html>
